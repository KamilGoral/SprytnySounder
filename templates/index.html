<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Przyciski dźwiękowe</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f4;
        }

        .button-container {
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            height: 100%;
            gap: 10px;
            padding: 10px;
            box-sizing: border-box;
        }

        .button {
            flex: 1 1 calc(25% - 10px); /* 4 przyciski na wiersz na większych ekranach */
            display: flex;
            align-items: center;
            background-color: #4CAF50; /* Zachowaj kolor */
            color: white;
            border: none;
            padding: 15px;
            font-size: 24px;
            cursor: pointer;
            border-radius: 5px;
            text-align: left;
            transition: background-color 0.3s ease;
        }

        .button:hover {
            background-color: #0056b3; /* Zachowaj kolor hover */
        }

        .button.disabled {
            background-color: #ccc; /* Wyszarzenie przycisku */
            cursor: not-allowed; /* Zmiana kursora na "not-allowed" */
        }

        .button.disabled:hover {
            background-color: #ccc; /* Brak zmiany koloru przy hover */
        }

        .button .icon {
            margin: 3rem; /* Zwiększony margines między ikoną a tekstem */
            font-size: 48px;
            flex-shrink: 0; /* Zapobiega zmniejszaniu ikony */
        }

        .button .text {
            flex-grow: 1;
            font-size: 1em; /* Domyślny rozmiar tekstu */
            line-height: 1.2;
            overflow: hidden; /* Zapobiega wychodzeniu tekstu poza przycisk */
            text-overflow: ellipsis; /* Dodaje "..." jeśli tekst jest za długi */
            white-space: normal; /* Pozwala na zawijanie tekstu */
        }

        /* Responsywność */
        @media (max-width: 1024px) {
            .button {
                flex: 1 1 calc(33.333% - 10px); /* 3 przyciski na wiersz na tabletach */
            }
        }

        @media (max-width: 768px) {
            .button {
                flex: 1 1 calc(50% - 10px); /* 2 przyciski na wiersz na mniejszych tabletach */
            }
        }

        @media (max-width: 480px) {
            .button {
                flex: 1 1 100%; /* 1 przycisk na wiersz na telefonach */
            }
            .button .text {
                font-size: 0.9em; /* Mniejszy tekst na telefonach */
            }
        }
    </style>
</head>
<body>
    <div class="button-container">
        {% for b in buttons %}
        <button class="button" onclick="playSound('{{ b.file }}')">
            <i class="fas {{ b.icon }} icon"></i>
            <span class="text">{{ b.label }}</span>
        </button>
        {% endfor %}
    </div>

    <script>
        let buttonsDisabled = false; // Flaga do sprawdzania, czy przyciski są zablokowane

        async function playSound(filename) {
            if (buttonsDisabled) return; // Zatrzymaj, jeśli przyciski są zablokowane

            buttonsDisabled = true; // Zablokuj przyciski
            disableButtons(true); // Zablokuj przyciski wizualnie

            try {
                const response = await fetch('/play-defined-sound', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ filename: filename })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    if (response.status === 423) {
                        alert('🔇 System wyciszony: ' + errorData.error);
                    } else {
                        alert('Błąd: ' + errorData.error);
                    }
                } else {
                    const data = await response.json();
                    console.log('Dźwięk odtworzony:', data.played_file);
                }
            } catch (error) {
                console.error('Błąd:', error);
                alert('Wystąpił błąd połączenia ze serwerem.');
            }

            setTimeout(() => {
                buttonsDisabled = false; // Odblokuj przyciski po 5 sekundach
                disableButtons(false); // Przywróć przyciski do stanu aktywnego
            }, 5000);
        }

        function disableButtons(disable) {
            const buttons = document.querySelectorAll('.button');
            buttons.forEach(button => {
                if (disable) {
                    button.classList.add('disabled');
                    button.disabled = true; // Blokuje kliknięcie
                } else {
                    button.classList.remove('disabled');
                    button.disabled = false; // Przywraca możliwość kliknięcia
                }
            });
        }
    </script>

    {% if bony_enabled %}
    <button id="bony-btn" onclick="toggleBony()">🎫 Pokaż bony</button>
    <div id="bony-panel" hidden>
        <div id="bony-lista">Ładowanie…</div>
    </div>
    <style>
        #bony-btn { position: fixed; bottom: 10px; right: 10px; z-index: 10;
            background: #FF9800; color: #fff; border: none; border-radius: 5px;
            padding: 12px 18px; font-size: 20px; cursor: pointer; }
        #bony-panel { position: fixed; bottom: 60px; right: 10px; z-index: 10;
            width: min(420px, calc(100vw - 20px)); max-height: 70vh; overflow-y: auto;
            background: #fff; border: 2px solid #FF9800; border-radius: 8px;
            padding: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
        .bon { border-bottom: 1px solid #eee; padding: 8px 4px; }
        .bon.swiezy { background: #FFF3E0; }
        .bon .numer { font-size: 22px; font-weight: bold; font-family: monospace;
            word-break: break-all; }
        .bon .meta { font-size: 16px; color: #555; }
        .bony-naglowek { font-size: 14px; font-weight: bold; color: #E65100;
            margin: 6px 0 2px; }
    </style>
    <script>
        let bonyTimer = null;
        function toggleBony() {
            const p = document.getElementById('bony-panel');
            p.hidden = !p.hidden;
            if (!p.hidden) { odswiezBony(); bonyTimer = setInterval(odswiezBony, 30000); }
            else { clearInterval(bonyTimer); }
        }
        async function odswiezBony() {
            const el = document.getElementById('bony-lista');
            try {
                const r = await fetch('/api/bony');
                const d = await r.json();
                if (!r.ok) { el.textContent = d.error || 'Błąd'; return; }
                if (!d.bony.length) {
                    el.textContent = 'Brak niezrealizowanych bonów z ostatnich 2 godzin.';
                    return;
                }
                const wiersz = b => `<div class="bon ${b.ostatnie15min ? 'swiezy' : ''}">
                        <div class="numer">${b.numer}</div>
                        <div class="meta">${(b.kwota_gr / 100).toFixed(2).replace('.', ',')} zł
                            &middot; wydany ${new Date(b.wydano_ts).toLocaleTimeString('pl-PL',
                                {hour: '2-digit', minute: '2-digit'})}</div>
                    </div>`;
                const swieze = d.bony.filter(b => b.ostatnie15min);
                const starsze = d.bony.filter(b => !b.ostatnie15min);
                el.innerHTML =
                    (swieze.length ? '<div class="bony-naglowek">OSTATNIE 15 MINUT</div>'
                        + swieze.map(wiersz).join('') : '')
                    + (starsze.length ? '<div class="bony-naglowek">Wcześniej (do 2 h)</div>'
                        + starsze.map(wiersz).join('') : '');
                if (d.stan === 'blad') el.innerHTML =
                    '<div class="bony-naglowek">⚠ dane mogą być nieaktualne</div>' + el.innerHTML;
            } catch { el.textContent = 'Brak połączenia z bonami.'; }
        }
    </script>
    {% endif %}
</body>
</html>
